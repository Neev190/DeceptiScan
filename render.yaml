services:
  - type: web
    name: deceptiscan-backend
    env: python
    # We specify 3.11, Render will use the latest patch version
    pythonVersion: 3.11
    # Run from the repo root but execute inside backend/
    buildCommand: "cd backend && pip install -r requirements.txt"
    # Gunicorn binds to Render's dynamic $PORT environment variable
    startCommand: "cd backend && gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 1 --threads 2"
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ACCESS_TOKEN_EXPIRES
        value: "3600"
      - key: JWT_REFRESH_TOKEN_EXPIRES
        value: "86400"
      - key: MAX_CONTENT_LENGTH
        value: "16777216"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_FACT_CHECK_API_KEY
        sync: false
